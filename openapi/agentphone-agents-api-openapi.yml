openapi: 3.2.0
info:
  title: SMS Agents API
  description: A simple API to provision phone numbers and receive SMS
  version: 0.1.0
tags:
- name: Agents
paths:
  /v1/agents/voices:
    get:
      tags:
      - Agents
      summary: List Voices
      description: Return available voices from the configured voice provider.
      operationId: list_voices_v1_agents_voices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/agents:
    post:
      tags:
      - Agents
      summary: Create Agent
      description: 'Create a new agent.


        An agent represents an AI persona (Support Bot, Sales Agent, etc.)

        that can have phone numbers attached to it.


        voiceMode: "webhook" (default) forwards transcripts to your webhook.

        "hosted" uses a built-in LLM with systemPrompt (no webhook needed).'
      operationId: create_agent_v1_agents_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Agents
      summary: List Agents
      description: List all agents for this account.
      operationId: list_agents_v1_agents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}:
    get:
      tags:
      - Agents
      summary: Get Agent
      description: Get a single agent with its attached numbers.
      operationId: get_agent_v1_agents__agent_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Agents
      summary: Update Agent
      description: 'Update an agent''s configuration.


        Use this to change voice mode, system prompt, greeting, or voice.

        Switching voiceMode to "hosted" re-provisions the voice agent with built-in LLM.'
      operationId: update_agent_v1_agents__agent_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agents
      summary: Delete Agent
      description: 'Delete an agent.


        Phone numbers, conversations, and calls associated with the agent will have their

        agent reference cleared (set to null) but will not be deleted themselves.'
      operationId: delete_agent_v1_agents__agent_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/numbers:
    post:
      tags:
      - Agents
      summary: Attach Number To Agent
      description: 'Attach an existing phone number to an agent.


        The number must belong to the same account and not be released.'
      operationId: attach_number_to_agent_v1_agents__agent_id__numbers_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachNumberRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachNumberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/numbers/{number_id}:
    delete:
      tags:
      - Agents
      summary: Detach Number From Agent
      description: 'Detach a phone number from an agent (sets agentId to null).


        The number remains active and can be re-attached to any agent.'
      operationId: detach_number_from_agent_v1_agents__agent_id__numbers__number_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: number_id
        in: path
        required: true
        schema:
          type: string
          title: Number Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/conversations:
    get:
      tags:
      - Agents
      summary: List Agent Conversations
      description: List all conversations for an agent.
      operationId: list_agent_conversations_v1_agents__agent_id__conversations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__routes__agents__ConversationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/{agent_id}/calls:
    get:
      tags:
      - Agents
      summary: List Agent Calls
      description: List all calls for an agent.
      operationId: list_agent_calls_v1_agents__agent_id__calls_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AgentNumberResponse:
      properties:
        id:
          type: string
          title: Id
        phoneNumber:
          type: string
          title: Phonenumber
        status:
          type: string
          title: Status
        type:
          type: string
          title: Type
          default: sms
      type: object
      required:
      - id
      - phoneNumber
      - status
      title: AgentNumberResponse
    CustomToolParam:
      properties:
        name:
          type: string
          title: Name
          description: Function name the agent calls. Letters, numbers, underscores, hyphens; max 64 chars. Must be unique and not a reserved built-in name.
        description:
          type: string
          title: Description
          description: What the tool does and when to use it. The agent relies on this to decide when to call it.
        url:
          type: string
          title: Url
          description: HTTPS endpoint the voice provider calls when the agent invokes this tool.
        method:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - GET
          - POST
          title: Method
          description: HTTP method. Defaults to POST.
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: Optional HTTP headers sent with the request (e.g. an Authorization token for your endpoint).
        parameters:
          anyOf:
          - type: object
          - type: 'null'
          title: Parameters
          description: JSON Schema object describing the arguments the agent fills in. Omit for a no-argument tool.
        timeoutMs:
          anyOf:
          - type: integer
            maximum: 120000.0
            minimum: 1000.0
          - type: 'null'
          title: Timeoutms
          description: How long to wait for your endpoint before giving up. Range 1000-120000 ms.
        speakDuringExecution:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Speakduringexecution
          description: When true, the agent speaks executionMessage while the tool runs.
        executionMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Executionmessage
          description: What the agent says while the tool runs (used when speakDuringExecution is true).
      type: object
      required:
      - name
      - description
      - url
      title: CustomToolParam
    AgentResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        voiceMode:
          type: string
          enum:
          - webhook
          - hosted
          title: Voicemode
        enableMessaging:
          type: boolean
          title: Enablemessaging
          default: true
        modelTier:
          type: string
          enum:
          - turbo
          - balanced
          - max
          - realtime
          title: Modeltier
          default: balanced
        systemPrompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Systemprompt
        beginMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Beginmessage
        voice:
          type: string
          title: Voice
        transferNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Transfernumber
        customTools:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Customtools
        voicemailMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Voicemailmessage
        callScreeningIdentity:
          anyOf:
          - type: string
          - type: 'null'
          title: Callscreeningidentity
        callScreeningPurpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Callscreeningpurpose
        sttMode:
          type: string
          enum:
          - fast
          - accurate
          title: Sttmode
          description: Speech-to-text mode. 'fast' optimizes for latency, 'accurate' optimizes for transcription accuracy (~200ms additional latency).
          default: fast
        ambientSound:
          type: string
          enum:
          - none
          - office
          - coffee-shop
          - outdoor
          title: Ambientsound
          description: Background ambience to mask synthetic silence between turns. 'none' disables; 'office', 'coffee-shop', 'outdoor' enable a quiet bed.
          default: none
        denoisingMode:
          type: string
          enum:
          - noise-cancellation
          - noise-and-background-speech-cancellation
          title: Denoisingmode
          description: Audio denoising. 'noise-cancellation' (default) handles general noise. 'noise-and-background-speech-cancellation' is more aggressive for callers in cars, cafes, or near TVs.
          default: noise-cancellation
        maxSilenceMs:
          type: integer
          title: Maxsilencems
          description: Hang up the call after this many milliseconds of caller silence. Range 10000 (10s) to 3600000 (1 hour). Default 600000 (10 min).
          default: 600000
        voiceSpeed:
          type: number
          title: Voicespeed
          description: Voice speed multiplier. Range 0.5 to 2.0. Default 1.0.
          default: 1.0
        interruptionSensitivity:
          type: number
          title: Interruptionsensitivity
          description: How easily callers can interrupt the agent. Range 0.0 to 1.0. Default 0.8.
          default: 0.8
        enableBackchannel:
          type: boolean
          title: Enablebackchannel
          description: When true, the agent interjects short filler words like 'uh-huh' or 'mhmm' during longer caller utterances. Defaults to true.
          default: true
        language:
          type: string
          title: Language
          description: BCP-47 locale that drives the agent's speech recognition and pronunciation. Defaults to 'en-US'.
          default: en-US
        createdAt:
          type: string
          format: date-time
          title: Createdat
        numbers:
          anyOf:
          - items:
              $ref: '#/components/schemas/AgentNumberResponse'
            type: array
          - type: 'null'
          title: Numbers
      type: object
      required:
      - id
      - name
      - description
      - voiceMode
      - voice
      - createdAt
      title: AgentResponse
    AttachNumberResponse:
      properties:
        agentId:
          type: string
          title: Agentid
        number:
          $ref: '#/components/schemas/AgentNumberResponse'
      type: object
      required:
      - agentId
      - number
      title: AttachNumberResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    CallListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CallSummary'
          type: array
          title: Data
        hasMore:
          type: boolean
          title: Hasmore
        total:
          type: integer
          title: Total
      type: object
      required:
      - data
      - hasMore
      - total
      title: CallListResponse
    AttachNumberRequest:
      properties:
        numberId:
          type: string
          title: Numberid
      type: object
      required:
      - numberId
      title: AttachNumberRequest
    DeleteAgentResponse:
      properties:
        success:
          type: boolean
          title: Success
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - success
      - id
      - name
      title: DeleteAgentResponse
    AgentListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AgentResponse'
          type: array
          title: Data
        total:
          type: integer
          title: Total
      type: object
      required:
      - data
      - total
      title: AgentListResponse
    app__routes__agents__ConversationSummary:
      properties:
        id:
          type: string
          title: Id
        agentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Agentid
        phoneNumberId:
          type: string
          title: Phonenumberid
        phoneNumber:
          type: string
          title: Phonenumber
        participant:
          type: string
          title: Participant
        lastMessageAt:
          type: string
          format: date-time
          title: Lastmessageat
        lastMessagePreview:
          type: string
          title: Lastmessagepreview
        messageCount:
          type: integer
          title: Messagecount
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - agentId
      - phoneNumberId
      - phoneNumber
      - participant
      - lastMessageAt
      - lastMessagePreview
      - messageCount
      - createdAt
      title: ConversationSummary
    UpdateAgentRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        voiceMode:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - webhook
          - hosted
          title: Voicemode
        enableMessaging:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablemessaging
          description: When true, hosted-mode agents can send and read SMS/iMessage during calls.
        modelTier:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - turbo
          - balanced
          - max
          - realtime
          title: Modeltier
        systemPrompt:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Systemprompt
        beginMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Beginmessage
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
        transferNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Transfernumber
        customTools:
          anyOf:
          - items:
              $ref: '#/components/schemas/CustomToolParam'
            type: array
          - type: 'null'
          title: Customtools
          description: Hosted-mode only. User-defined function tools the agent can call during a call. Replaces the full set on each update; send [] to clear all tools, or omit to leave unchanged. Ignored in webhook mode. Maximum 20 tools.
        voicemailMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Voicemailmessage
        callScreeningIdentity:
          anyOf:
          - type: string
          - type: 'null'
          title: Callscreeningidentity
        callScreeningPurpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Callscreeningpurpose
        sttMode:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - fast
          - accurate
          title: Sttmode
          description: Speech-to-text mode. 'fast' optimizes for latency, 'accurate' optimizes for transcription accuracy (~200ms additional latency).
        ambientSound:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - none
          - office
          - coffee-shop
          - outdoor
          title: Ambientsound
          description: Background ambience to mask synthetic silence between turns. 'none' disables; 'office', 'coffee-shop', 'outdoor' enable a quiet bed.
        denoisingMode:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - noise-cancellation
          - noise-and-background-speech-cancellation
          title: Denoisingmode
          description: Audio denoising. 'noise-cancellation' (default) handles general noise. 'noise-and-background-speech-cancellation' is more aggressive for callers in cars, cafes, or near TVs.
        maxSilenceMs:
          anyOf:
          - type: integer
            maximum: 3600000.0
            minimum: 10000.0
          - type: 'null'
          title: Maxsilencems
          description: Hang up the call after this many milliseconds of caller silence. Default 600000 (10 min). Raise for IVR/hold-music workflows; lower to fail fast on dead lines. Range 10000 (10s) to 3600000 (1 hour).
        voiceSpeed:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.5
          - type: 'null'
          title: Voicespeed
          description: Voice speed multiplier. 1.0 is normal pace; lower slows speech (0.5 is half speed), higher speeds it up (2.0 is double). Range 0.5 to 2.0.
        interruptionSensitivity:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Interruptionsensitivity
          description: How easily callers can interrupt the agent. 0 means the agent is never interrupted, 1 means the agent stops at the first sound. Default 0.8. Range 0.0 to 1.0.
        enableBackchannel:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablebackchannel
          description: When true, the agent interjects short filler words like 'uh-huh' or 'mhmm' during longer caller utterances. Set false to keep the agent silent while the caller is speaking.
        language:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - af-ZA
          - ar-SA
          - az-AZ
          - bg-BG
          - bs-BA
          - ca-ES
          - cs-CZ
          - cy-GB
          - da-DK
          - de-DE
          - el-GR
          - en-AU
          - en-GB
          - en-IN
          - en-NZ
          - en-US
          - es-419
          - es-ES
          - fa-IR
          - fi-FI
          - fil-PH
          - fr-CA
          - fr-FR
          - gl-ES
          - he-IL
          - hi-IN
          - hr-HR
          - hu-HU
          - hy-AM
          - id-ID
          - is-IS
          - it-IT
          - ja-JP
          - kk-KZ
          - kn-IN
          - ko-KR
          - lt-LT
          - lv-LV
          - mk-MK
          - mr-IN
          - ms-MY
          - ne-NP
          - nl-BE
          - nl-NL
          - no-NO
          - pl-PL
          - pt-BR
          - pt-PT
          - ro-RO
          - ru-RU
          - sk-SK
          - sl-SI
          - sr-RS
          - sv-SE
          - sw-KE
          - ta-IN
          - th-TH
          - tr-TR
          - uk-UA
          - ur-IN
          - vi-VN
          - yue-CN
          - zh-CN
          title: Language
          description: BCP-47 locale that drives the agent's speech recognition and pronunciation. See the enum for the full set of supported codes.
      type: object
      title: UpdateAgentRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CallSummary:
      properties:
        id:
          type: string
          title: Id
        agentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Agentid
        phoneNumberId:
          anyOf:
          - type: string
          - type: 'null'
          title: Phonenumberid
        phoneNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Phonenumber
        fromNumber:
          type: string
          title: Fromnumber
        toNumber:
          type: string
          title: Tonumber
        direction:
          type: string
          title: Direction
        status:
          type: string
          title: Status
        startedAt:
          type: string
          format: date-time
          title: Startedat
        endedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endedat
        durationSeconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Durationseconds
        lastTranscriptSnippet:
          anyOf:
          - type: string
          - type: 'null'
          title: Lasttranscriptsnippet
      type: object
      required:
      - id
      - agentId
      - phoneNumberId
      - phoneNumber
      - fromNumber
      - toNumber
      - direction
      - status
      - startedAt
      - endedAt
      - durationSeconds
      - lastTranscriptSnippet
      title: CallSummary
    app__routes__agents__ConversationListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/app__routes__agents__ConversationSummary'
          type: array
          title: Data
        hasMore:
          type: boolean
          title: Hasmore
        total:
          type: integer
          title: Total
      type: object
      required:
      - data
      - hasMore
      - total
      title: ConversationListResponse
    CreateAgentRequest:
      properties:
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        voiceMode:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - webhook
          - hosted
          title: Voicemode
        enableMessaging:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablemessaging
          description: When true, hosted-mode agents can send and read SMS/iMessage during calls. Defaults to true.
        modelTier:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - turbo
          - balanced
          - max
          - realtime
          title: Modeltier
        systemPrompt:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Systemprompt
        beginMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Beginmessage
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
        transferNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Transfernumber
        customTools:
          anyOf:
          - items:
              $ref: '#/components/schemas/CustomToolParam'
            type: array
          - type: 'null'
          title: Customtools
          description: Hosted-mode only. User-defined function tools the agent can call during a call (look up a record, save call notes, etc.). Each points at your HTTPS endpoint; the voice provider invokes it and feeds the JSON response back to the agent. Ignored in webhook mode. Maximum 20 tools.
        voicemailMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Voicemailmessage
        callScreeningIdentity:
          anyOf:
          - type: string
          - type: 'null'
          title: Callscreeningidentity
        callScreeningPurpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Callscreeningpurpose
        sttMode:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - fast
          - accurate
          title: Sttmode
          description: Speech-to-text mode. 'fast' optimizes for latency, 'accurate' optimizes for transcription accuracy (~200ms additional latency).
        ambientSound:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - none
          - office
          - coffee-shop
          - outdoor
          title: Ambientsound
          description: Background ambience to mask synthetic silence between turns. 'none' disables; 'office', 'coffee-shop', 'outdoor' enable a quiet bed.
        denoisingMode:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - noise-cancellation
          - noise-and-background-speech-cancellation
          title: Denoisingmode
          description: Audio denoising. 'noise-cancellation' (default) handles general noise. 'noise-and-background-speech-cancellation' is more aggressive for callers in cars, cafes, or near TVs.
        maxSilenceMs:
          anyOf:
          - type: integer
            maximum: 3600000.0
            minimum: 10000.0
          - type: 'null'
          title: Maxsilencems
          description: Hang up the call after this many milliseconds of caller silence. Default 600000 (10 min). Raise for IVR/hold-music workflows; lower to fail fast on dead lines. Range 10000 (10s) to 3600000 (1 hour).
        voiceSpeed:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.5
          - type: 'null'
          title: Voicespeed
          description: Voice speed multiplier. 1.0 is normal pace; lower values slow speech (0.5 is half speed), higher values speed it up (2.0 is double). Range 0.5 to 2.0.
        interruptionSensitivity:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Interruptionsensitivity
          description: How easily callers can interrupt the agent. 0 means the agent is never interrupted, 1 means the agent stops at the first sound. Default 0.8. Range 0.0 to 1.0.
        enableBackchannel:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enablebackchannel
          description: When true, the agent interjects short filler words like 'uh-huh' or 'mhmm' during longer caller utterances. Set false to keep the agent silent while the caller is speaking. Defaults to true.
        language:
          anyOf:
          - type: string
          - type: 'null'
          enum:
          - af-ZA
          - ar-SA
          - az-AZ
          - bg-BG
          - bs-BA
          - ca-ES
          - cs-CZ
          - cy-GB
          - da-DK
          - de-DE
          - el-GR
          - en-AU
          - en-GB
          - en-IN
          - en-NZ
          - en-US
          - es-419
          - es-ES
          - fa-IR
          - fi-FI
          - fil-PH
          - fr-CA
          - fr-FR
          - gl-ES
          - he-IL
          - hi-IN
          - hr-HR
          - hu-HU
          - hy-AM
          - id-ID
          - is-IS
          - it-IT
          - ja-JP
          - kk-KZ
          - kn-IN
          - ko-KR
          - lt-LT
          - lv-LV
          - mk-MK
          - mr-IN
          - ms-MY
          - ne-NP
          - nl-BE
          - nl-NL
          - no-NO
          - pl-PL
          - pt-BR
          - pt-PT
          - ro-RO
          - ru-RU
          - sk-SK
          - sl-SI
          - sr-RS
          - sv-SE
