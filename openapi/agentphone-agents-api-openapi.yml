          - ta-IN
          - th-TH
          - tr-TR
          - uk-UA
          - ur-IN
          - vi-VN
          - yue-CN
          - zh-CN
          title: Language
          description: BCP-47 locale that drives the agent's speech recognition and pronunciation. Defaults to 'en-US'. See the enum for the full set of supported codes.
      type: object
      required:
      - name
      title: CreateAgentRequest
