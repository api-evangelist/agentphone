aid: agentphone
name: AgentPhone
description: >-
  AgentPhone is the telephony infrastructure layer for AI agents. A single REST
  API provisions real US/Canada phone numbers for agents with voice calling, SMS,
  MMS, and iMessage built in, plus unified webhooks, automatic conversation
  threading, real-time call transcription, hosted-LLM or webhook voice modes, and
  10DLC/A2P compliance handled for you. Official Python and TypeScript SDKs and a
  published MCP server let agents buy numbers, place calls, and send messages
  through natural language. Founded 2026 (Y Combinator), used by teams at Google
  ADK, Replit, LangChain, Sim AI, and Alchemy.
