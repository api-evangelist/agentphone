openapi: 3.2.0
info:
  title: SMS Location API
  description: A simple API to provision phone numbers and receive SMS
  version: 0.1.0
tags:
- name: Location
paths:
  /v1/location/{phone_number}:
    get:
      tags:
      - Location
      summary: Get Location
      operationId: get_location_v1_location__phone_number__get
      security:
      - HTTPBearer: []
      parameters:
      - name: phone_number
        in: path
        required: true
        schema:
          type: string
          title: Phone Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/location/refresh:
    post:
      tags:
      - Location
      summary: Refresh Locations
      operationId: refresh_locations_v1_location_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationRefreshResponse'
      security:
      - HTTPBearer: []
components:
  schemas:
    LocationResponse:
      properties:
        phoneNumber:
          type: string
          title: Phonenumber
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        status:
          type: string
          title: Status
        lastUpdated:
          type: integer
          title: Lastupdated
      type: object
      required:
      - phoneNumber
      - status
      - lastUpdated
      title: LocationResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    LocationRefreshResponse:
      properties:
        success:
          type: boolean
          title: Success
        pollAfterSeconds:
          type: integer
          title: Pollafterseconds
          default: 20
      type: object
      required:
      - success
      title: LocationRefreshResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: AgentPhone
  source: https://api.agentphone.ai/openapi.json
